<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1116" />
    <title>Ноутбук-пианино</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1116;
        --panel: #141821;
        --text: #cfd6e4;
        --muted: #8b93a7;
        --accent: #ffd166;
        --error: #ff7a6e;
        --ok: #7ddba3;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        user-select: none;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      /* Верхний слой — колонки нот (заполняет очередь плеера/рендера нот) */
      #noteCanvas {
        flex: 7 1 0;
        min-height: 0;
        width: 100%;
        display: block;
        background: var(--bg);
      }
      /* Нижний слой — экранные клавиши */
      #keyboardCanvas {
        flex: 3 1 0;
        min-height: 0;
        width: 100%;
        display: block;
        background: var(--panel);
      }
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 18px;
        padding: 8px 14px;
        font-size: 12px;
        color: var(--muted);
        background: color-mix(in srgb, var(--bg) 78%, transparent);
        pointer-events: none;
        z-index: 10;
      }
      #hud b {
        color: var(--text);
        font-weight: 600;
      }
      #hudLoad.loading {
        color: var(--accent);
      }
      #hudLoad.ready {
        color: var(--ok);
      }
      #hudLoad.error {
        color: var(--error);
      }
      #hudAttribution {
        margin-left: auto;
        opacity: 0.75;
      }
      #hint {
        position: fixed;
        top: 32%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 14px 26px;
        font-size: 22px;
        letter-spacing: 0.02em;
        color: var(--text);
        background: color-mix(in srgb, var(--panel) 85%, transparent);
        border: 1px solid color-mix(in srgb, var(--muted) 35%, transparent);
        border-radius: 12px;
        pointer-events: none;
        z-index: 9;
        transition: opacity 0.5s ease;
      }
      #hint.hidden {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="noteCanvas"></canvas>
      <canvas id="keyboardCanvas"></canvas>
    </div>
    <header id="hud">
      <span>Пресет: <b id="hudPreset">Фортепиано</b></span>
      <span>Диапазон: <b id="hudRange">C4–F5</b></span>
      <span><b>Z</b>/<b>X</b> — октава · <b>Space</b> — педаль · <b>1–4</b> — пресет</span>
      <span id="hudLoad"></span>
      <span id="hudAttribution">Сэмплы фортепиано: Splendid Grand Piano (public domain)</span>
    </header>
    <div id="hint">Жми клавиши — звучит фортепиано</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
